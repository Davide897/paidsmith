<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1020">
<meta name="app-version" content="v20">
<meta name="description" content="Paidsmith: faturas em PDF, despesas com foto do recibo e prazos de pagamento, em € e £, no telemóvel e no computador. 30 dias grátis.">
<meta property="og:title" content="Paidsmith · faturas, recibos e pagamentos">
<meta property="og:description" content="Faturas em PDF em 3 línguas, despesas com foto do recibo e quem te deve, à vista. 30 dias grátis.">
<meta property="og:image" content="https://davide897.github.io/paidsmith/icon-512.png">
<meta name="apple-mobile-web-app-title" content="Paidsmith">
<title>Paidsmith</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#0B1020; --bg2:#10172C; --card:#141B33; --line:#232C4C;
  --tx:#EEF0F7; --tx2:#8E97B5; --acc:#E7B54E; --acc2:#FBE3A1;
  --gold:linear-gradient(135deg,#FBE3A1 0%,#E7B54E 50%,#B9862A 100%);
  --green:#4ADE80; --red:#FF6B6B; --amber:#FF9F43;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-weight:700;margin:0}
button{font-family:inherit;font-size:15px;border:none;border-radius:10px;cursor:pointer;padding:11px 16px}
input,select,textarea{font-family:inherit;font-size:16px;background:var(--bg2);color:var(--tx);
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
label{display:block;font-size:13px;color:var(--tx2);margin:14px 0 5px}
.btn-p{background:var(--acc);color:#fff;font-weight:600}
.btn-g{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn-green{background:var(--green);color:#0c2416;font-weight:700}
.btn-red{background:transparent;color:var(--red);border:1px solid var(--red)}
.hidden{display:none!important}
#topbar{position:sticky;top:0;z-index:20;background:rgba(22,24,29,.92);backdrop-filter:blur(12px);
  padding:calc(14px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between}
#topbar h1{font-size:19px;letter-spacing:.5px}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:rgba(22,24,29,.95);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;background:none;color:var(--tx2);font-size:11px;padding:9px 0 7px;border-radius:0;
  display:flex;flex-direction:column;align-items:center;gap:3px}
#tabs button.on{color:var(--acc)}
#tabs svg{width:22px;height:22px}
main{padding:16px;max-width:860px;margin:0 auto 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.chips{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  color:var(--tx2);font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.inv-item{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.inv-item .amt{text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.badge.paid{background:rgba(46,204,113,.15);color:var(--green)}
.badge.unpaid{background:rgba(255,92,92,.15);color:var(--red)}
.badge.late{background:rgba(245,185,66,.18);color:var(--amber)}
.grp{margin:22px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--tx2)}
.banner{background:linear-gradient(135deg,#223,#1b2535);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-bottom:14px}
.banner b{font-size:18px}
.lines-tbl{width:100%;border-collapse:collapse;margin-top:6px}
.lines-tbl td{padding:4px 3px;vertical-align:middle}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;
  border-radius:50%;background:var(--acc);color:#fff;font-size:30px;line-height:1;z-index:15;
  box-shadow:0 6px 18px rgba(231,181,78,.35)}
.total-box{background:var(--bg2);border-radius:12px;padding:12px 14px;margin-top:12px}
.total-box .tr{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.total-box .tr.big{font-size:18px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
.cal-grid{display:grid;grid-template-columns:30px repeat(7,1fr);gap:4px}
.cal-wk{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--tx2);
  background:var(--bg2);border-radius:6px}
.cal-wk.now{background:var(--acc);color:#fff;font-weight:700}
.cal-day.wk-now{background:#2a2f3a}
.cal-dow{text-align:center;font-size:11px;color:var(--tx2);padding:4px 0}
.cal-day{min-height:58px;background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:4px;font-size:12px;position:relative;cursor:pointer}
.cal-day.dim{opacity:.35}
.cal-day.today{border-color:var(--acc)}
.cal-day .n{color:var(--tx2)}
.dot{display:block;margin-top:2px;border-radius:5px;font-size:10px;font-weight:700;padding:1px 3px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot.paid{background:rgba(46,204,113,.2);color:var(--green)}
.dot.due{background:rgba(245,185,66,.2);color:var(--amber)}
.dot.late{background:rgba(255,92,92,.22);color:var(--red)}
.dot.pay{background:rgba(231,181,78,.16);color:var(--acc);border:1px dashed var(--acc)}
.legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--tx2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
#login{max-width:380px;margin:12vh auto;padding:0 20px}
#login h1{font-size:30px;letter-spacing:2px;margin-bottom:4px}
#login p{color:var(--tx2);margin-top:0}
.hint{font-size:12.5px;color:var(--tx2);line-height:1.5;margin-top:8px}
.del-x{background:none;color:var(--red);font-size:18px;padding:4px 8px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg2);border-radius:18px 18px 0 0;width:100%;max-width:860px;max-height:88vh;
  overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet>div{border-radius:18px;max-height:85vh}}
.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--bg2);border:1px solid var(--line);flex:none}
.thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:20px}
.ph-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ph-grid .ph-it{position:relative}
.ph-grid img{width:84px;height:84px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:pointer}
.ph-grid .del-x{position:absolute;top:-8px;right:-8px;background:var(--bg);border:1px solid var(--line);border-radius:50%;
  width:26px;height:26px;padding:0;font-size:13px}
.cam-btn{width:100%;padding:16px;font-size:17px;font-weight:700}
.sel-box{width:24px;height:24px;border-radius:7px;border:2px solid var(--tx2);flex:none;display:flex;
  align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff}
.card.sel{border-color:var(--acc)}
.card.sel .sel-box{background:var(--acc);border-color:var(--acc)}
.sel-bar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:16;
  background:rgba(22,24,29,.97);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px}
.sel-bar button{flex:1;padding:12px 6px}
.ph-view{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center}
.ph-view img{max-width:96vw;max-height:92vh;border-radius:8px}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:#2a2e38;border:1px solid var(--line);color:var(--tx);padding:11px 20px;border-radius:12px;
  z-index:99;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}

/* ===== Paidsmith · Selo, Noite e Ouro ===== */
@font-face{font-family:'Fraunces';src:url(fonts/fraunces.woff2) format('woff2');font-weight:600 800;font-display:swap}
@font-face{font-family:'Manrope';src:url(fonts/manrope.woff2) format('woff2');font-weight:400 800;font-display:swap}
html,body{font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
html{background:radial-gradient(900px 520px at 0% -8%,#1B2650 0%,rgba(11,16,32,0) 62%),radial-gradient(700px 420px at 100% 0%,rgba(231,181,78,.07) 0%,rgba(11,16,32,0) 60%),var(--bg);background-attachment:fixed;min-height:100%}
body{background:transparent;display:flow-root}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.2px}
button{border-radius:12px;font-weight:600;transition:transform .08s ease,filter .15s ease}
button:active{transform:scale(.97)}
.btn-p{background:var(--gold);color:#1B1405;font-weight:800;box-shadow:0 6px 18px rgba(231,181,78,.22)}
.btn-p:hover{filter:brightness(1.06)}
.btn-g{background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--tx)}
.btn-g:hover{border-color:rgba(231,181,78,.45)}
.btn-green{background:linear-gradient(135deg,#86EFAC,#22C55E);color:#052012}
input,select,textarea{background:#0D1430;border:1px solid var(--line);border-radius:12px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(231,181,78,.15)}
label{color:var(--tx2);font-weight:600;letter-spacing:.2px}
#topbar{background:rgba(11,16,32,.82);border-bottom:1px solid rgba(231,181,78,.14)}
#topbar h1{font-size:21px;display:flex;align-items:center;gap:10px}
#topbar h1::before{content:"";width:28px;height:28px;border-radius:8px;background:url(favicon.svg) center/cover;flex:none}
#tabs{background:rgba(12,18,38,.92);border-top:1px solid rgba(231,181,78,.14)}
#tabs button{font-weight:600;position:relative}
#tabs button.on{color:var(--acc2)}
#tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;border-radius:2px;background:var(--gold)}
.card{background:linear-gradient(180deg,#161E3A 0%,#121933 100%);border:1px solid var(--line);border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 22px rgba(0,0,0,.22)}
.inv-item{transition:border-color .15s ease,transform .08s ease}
.inv-item:hover{border-color:rgba(231,181,78,.35)}
.inv-item:active{transform:scale(.99)}
.inv-item .amt>div:first-child{font-family:Fraunces,Georgia,serif;font-size:17px}
.chip{background:rgba(255,255,255,.035);border:1px solid var(--line);font-weight:600}
.chip.on{background:var(--gold);border-color:transparent;color:#1B1405}
.badge{letter-spacing:.3px}
.badge.paid{background:rgba(74,222,128,.13)}
.badge.late{background:rgba(255,159,67,.15)}
.banner{background:radial-gradient(420px 200px at 100% 0%,rgba(231,181,78,.16),rgba(0,0,0,0) 70%),linear-gradient(135deg,#1D2A52 0%,#0F1630 100%);
  border:1px solid rgba(231,181,78,.28);border-radius:20px;padding:18px 18px;color:var(--tx2);
  box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.banner b{display:block;font-family:Fraunces,Georgia,serif;font-size:30px;line-height:1.15;margin:4px 0 2px;
  background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.grp{color:var(--acc);opacity:.85;font-weight:700}
.fab{border-radius:18px;background:var(--gold);color:#1B1405;font-weight:400;box-shadow:0 10px 26px rgba(231,181,78,.35)}
.total-box{background:#0D1430;border:1px solid var(--line);border-radius:14px}
.total-box .tr.big{font-family:Fraunces,Georgia,serif;color:var(--acc2)}
.cal-wk.now{background:var(--gold);color:#1B1405}
.cal-day{background:linear-gradient(180deg,#151D38,#121933)}
.cal-day.wk-now{background:#1A2448}
.sheet{background:rgba(3,6,16,.7);backdrop-filter:blur(4px)}
.sheet>div{background:linear-gradient(180deg,#121A35 0%,#0E1430 100%);border-top:1px solid rgba(231,181,78,.25)}
.sel-bar{background:rgba(12,18,38,.96);border-top:1px solid rgba(231,181,78,.2)}
.card.sel .sel-box{color:#1B1405}
.sub-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 16px;font-size:13.5px;font-weight:600;
  background:linear-gradient(90deg,rgba(231,181,78,.16),rgba(231,181,78,.05));border-bottom:1px solid rgba(231,181,78,.25);color:var(--acc2)}
.sub-bar button{padding:7px 12px;font-size:13px;flex:none}
.sub-bar.late{background:linear-gradient(90deg,rgba(255,107,107,.18),rgba(255,107,107,.05));border-color:rgba(255,107,107,.35);color:#FFC4C4}
input[type=checkbox]{accent-color:var(--acc);width:18px;height:18px}
.bubble{padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.5;max-width:88%}
.bubble.user{align-self:flex-end;background:var(--gold);color:#1B1405;border-bottom-right-radius:4px}
.bubble.assistant{align-self:flex-start;background:#0D1430;border:1px solid var(--line);border-bottom-left-radius:4px}
#tut{position:fixed;inset:0;z-index:70}
.tut-dim{position:fixed;inset:0;background:rgba(3,6,16,.72)}
.tut-ring{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(3,6,16,.72),0 0 0 2px var(--acc),0 0 22px rgba(231,181,78,.55);pointer-events:none;transition:all .25s ease}
.tut-card{position:fixed;background:linear-gradient(180deg,#18214A,#111833);border:1px solid rgba(231,181,78,.4);border-radius:18px;padding:16px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.cp{padding:4px 8px;font-size:13px;line-height:1;flex:none}
#epc-qr svg{width:100%;height:100%;display:block}
.lang-sel{width:auto;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:700;background:rgba(255,255,255,.04)}
.toast{background:#141B33;border:1px solid rgba(231,181,78,.35);border-radius:14px}
#login{max-width:none;margin:0;padding:0 20px 40px}
.lp-nav{max-width:1080px;margin:0 auto;padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.lp-wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:28px;align-items:start}
.lp-auth{background:linear-gradient(180deg,#161E3A,#111833);border:1px solid rgba(231,181,78,.28);border-radius:20px;padding:20px;box-shadow:0 18px 40px rgba(0,0,0,.35);max-width:440px;width:100%;justify-self:center}
.lp-auth-t{font-size:22px;margin:0 0 4px}
.lp-eyebrow{color:var(--acc);font-weight:800;letter-spacing:1.2px;text-transform:uppercase;font-size:12.5px}
.lp-h1{font-size:clamp(32px,6vw,52px);line-height:1.05;margin:10px 0 14px;letter-spacing:-.8px}
.lp-h1 span{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.lp-sub{font-size:17px;line-height:1.55;color:var(--tx2);max-width:560px}
.lp-ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.lp-ctas button{padding:14px 20px;font-size:16px}
.lp-trust{margin-top:12px;color:var(--tx2);font-size:13.5px}
.lp-shots{display:flex;gap:14px;margin-top:26px}
.lp-shots img{width:46%;max-width:230px;border-radius:26px;border:6px solid #05070F;box-shadow:0 22px 50px rgba(0,0,0,.5)}
.lp-shots img:nth-child(2){transform:translateY(26px)}
.lp-sec{max-width:1080px;margin:64px auto 0}
.lp-h2{font-size:clamp(26px,4vw,36px);margin-bottom:18px}
.lp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.lp-feat h3{font-size:18px;margin:8px 0 4px}.lp-feat p{margin:0;color:var(--tx2);line-height:1.5;font-size:14.5px}
.lp-ic{font-size:26px;width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:rgba(231,181,78,.12);border:1px solid rgba(231,181,78,.25)}
.lp-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.lp-step{display:flex;gap:14px;align-items:flex-start}.lp-step h3{font-size:18px;margin:2px 0 4px}.lp-step p{margin:0;color:var(--tx2)}
.lp-num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#1B1405;font:800 18px Fraunces,Georgia,serif;display:flex;align-items:center;justify-content:center}
.lp-price{max-width:440px}.lp-price-n{font:700 44px Fraunces,Georgia,serif;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.lp-list{padding-left:20px;line-height:1.9;color:var(--tx)}
.lp-foot{max-width:1080px;margin:56px auto 0;padding-top:18px;border-top:1px solid var(--line);color:var(--tx2);font-size:13.5px}
.lp-foot a{color:var(--acc)}
@media(min-width:900px){.lp-wrap{grid-template-columns:1.15fr .85fr;gap:48px;margin-top:20px}.lp-auth{position:sticky;top:24px}}
body.standalone .lp-mkt{display:none!important}
body.standalone #login{max-width:420px;margin:8vh auto 0}
body.standalone .lp-wrap{grid-template-columns:1fr}
body.standalone .lp-auth{background:none;border:none;box-shadow:none;padding:0}
#login h1.brand{display:flex;align-items:center;gap:12px;font-size:30px;letter-spacing:-.3px;white-space:nowrap}
#login h1.brand img{width:52px;height:52px;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.45)}
#login h1.brand .wm span{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
#login p#lg-tag{font-size:15px;margin:10px 0 6px}
#login .chips{flex-wrap:nowrap;gap:6px}
#login .chip{padding:6px 11px;font-size:13px}
.lines-tbl input,.lines-tbl select{padding:10px 7px;font-size:15px}
.lines-tbl select{-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center;padding:10px 4px}

@media(min-width:900px){main{padding-top:24px}.card{border-radius:18px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <header class="lp-nav">
    <h1 class="brand"><img src="favicon.svg" alt=""><span class="wm">Paid<span>smith</span></span></h1>
    <div class="chips" style="margin:0">
      <select id="lang-sel" class="lang-sel" onchange="setLang(this.value)" aria-label="Language"></select>
    </div>
  </header>
  <div class="lp-wrap">
  <section class="lp-pitch lp-mkt">
    <div class="lp-eyebrow" data-t="lpEyebrow"></div>
    <h2 class="lp-h1" data-t="lpH1"></h2>
    <p class="lp-sub" data-t="lpSub"></p>
    <div class="lp-ctas"><button class="btn-p" onclick="lpGo(true)" data-t="lpCta"></button><button class="btn-g" onclick="lpGo(false)" data-t="lpLogin"></button></div>
    <div class="lp-trust" data-t="lpTrust"></div>
    <div class="lp-shots"><img src="assets/app-faturas.webp" alt="" loading="lazy"><img src="assets/app-despesas.webp" alt="" loading="lazy"></div>

const EUR = v => new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(v||0);
const GBP = v => new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(v||0);
// moedas suportadas; câmbios em S.rates = unidades por 1 EUR (BCE via frankfurter.dev)
const CURRENCIES = ['EUR','GBP','USD','CHF','PLN','RON','TRY','SEK','DKK','NOK','CZK','HUF'];
const CUR_LOCALE = {EUR:'pt-PT',GBP:'en-GB',USD:'en-US',CHF:'de-CH',PLN:'pl-PL',RON:'ro-RO',TRY:'tr-TR',SEK:'sv-SE',DKK:'da-DK',NOK:'nb-NO',CZK:'cs-CZ',HUF:'hu-HU'};
const normCur = c => CURRENCIES.includes(c) ? c : 'EUR';
const fmt = (v,c) => { c = normCur(c); return new Intl.NumberFormat(CUR_LOCALE[c],{style:'currency',currency:c}).format(v||0); };
const curOpts = sel => CURRENCIES.map(c=>`<option ${normCur(sel)===c?'selected':''}>${c}</option>`).join('');
const toEUR = (v,c) => { c = normCur(c); if(c==='EUR') return v; const r = S.rates && S.rates[c]; return r ? v / r : null; };
const curParts = totals => CURRENCIES.filter(c=>totals[c]).map(c=>fmt(totals[c],c));
const rateTxt = c => S.rates && S.rates[c] ? `1 ${c} = ${(1/S.rates[c]).toFixed(4)} EUR` : '';
const dmy = d => { if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y}`; };
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const todayISO = () => new Date().toISOString().slice(0,10);

// Fica desligado enquanto TS_SITE_KEY estiver vazio. A chave do site é pública; a secreta vive só no Supabase.
const TS_SITE_KEY = '0x4AAAAAAFi8qBJoDdfq6zLv';
// Termos e Privacidade: só aparecem quando os documentos estiverem publicados.
const LEGAL_READY = true;
let tsWidget = null;
function initCaptcha(){
  if(!TS_SITE_KEY) return;
  const box = document.getElementById('lg-captcha'); box.classList.remove('hidden');
  const sc = document.createElement('script');
  sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; sc.async = true;
  sc.onload = () => { tsWidget = turnstile.render(box, {sitekey:TS_SITE_KEY, theme:'dark', language:L}); };
  document.head.appendChild(sc);
}
function captchaToken(){
  if(!TS_SITE_KEY) return undefined;
  const tok = window.turnstile && tsWidget !== null ? turnstile.getResponse(tsWidget) : '';
  return tok || null;
}
function captchaReset(){ if(TS_SITE_KEY && window.turnstile && tsWidget !== null) turnstile.reset(tsWidget); }
function captchaOpts(){
  const tok = captchaToken();
  if(tok === null){ toast(t('captchaWait')); return null; }
  return tok ? {captchaToken: tok} : {};
}
function initLegal(){
  if(!LEGAL_READY) return;
  document.getElementById('lg-legal').classList.remove('hidden');
  const lnk = (f, k) => `<a href="${f}?lang=${L}" target="_blank" rel="noopener" style="color:var(--acc)">${t(k)}</a>`;
  document.getElementById('lg-legal-txt').innerHTML = t('legalAccept').replace('{terms}', lnk('terms.html','legalTerms')).replace('{privacy}', lnk('privacy.html','legalPrivacy'));
}

// O email fica na app; a password fica no gestor de passwords do aparelho (cifrado), nunca em localStorage.
async function rememberLogin(f){
  if(document.getElementById('lg-remember').checked) localStorage.setItem('inv_remember_email', f.email);
  else localStorage.removeItem('inv_remember_email');
  try{ if(window.PasswordCredential && navigator.credentials)
    await navigator.credentials.store(new PasswordCredential({id:f.email, password:f.password, name:f.email})); }catch(e){}
}
function prefillLogin(){
  const em = localStorage.getItem('inv_remember_email');
  if(em){ document.getElementById('lg-email').value = em; document.getElementById('lg-remember').checked = true; }
}
// ---------- AUTH ----------
function authPT(msg){
  const m = (msg||'').toLowerCase();
  if(m.includes('anonymous')) return t('errFill');
  if(m.includes('invalid login credentials')) return t('errCreds');
  if(m.includes('already registered')) return t('errExists');
  if(m.includes('at least')) return t('errPass');
  if(m.includes('valid email') || m.includes('invalid format')) return t('errEmail');
  if(m.includes('rate limit') || m.includes('too many')) return t('errRate');
  return 'Erro: '+msg;
}
function authFields(signup){
  const email = lgv('lg-email'), pass = lgv('lg-pass');
  if(!email || !pass){ toast(t('errFill')); return null; }
  if(!/^\S+@\S+\.\S+$/.test(email)){ toast(t('errEmail')); return null; }
  if(signup && pass.length < 8){ toast(t('errPass')); return null; }
  return {email, password: pass};
}
async function doLogin(){
  const f = authFields(); if(!f) return;
  const co = captchaOpts(); if(!co) return;
  const {data,error} = await sb.auth.signInWithPassword({...f, options:co}); captchaReset();
  if(error){ toast(authPT(error.message)); return; }
  await rememberLogin(f);
  boot(data.session);
}
async function doSignup(){
  const f = authFields(true); if(!f) return;
  if(LEGAL_READY && !document.getElementById('lg-legal-ok').checked){ toast(t('legalNeed')); return; }
  const co = captchaOpts(); if(!co) return;
  const {data,error} = await sb.auth.signUp({...f, options:co}); captchaReset();
  if(error){ toast(authPT(error.message)); return; }
  if(data.session) boot(data.session); else mailNotice(t('created'));
}
function lgv(id){ return document.getElementById(id).value.trim(); }
async function logout(){
  if(S.user && getQueue().length && !confirm(t('pendingLogout'))) return;
  localStorage.removeItem('inv_last_user');
  try{ await sb.auth.signOut(); }catch(e){}
  location.reload();
}
async function forgotPass(){
  const email = lgv('lg-email');
  if(!/^\S+@\S+\.\S+$/.test(email)){ toast(t('forgotNeedEmail')); return; }
  if(!navigator.onLine){ toast(t('needOnline')); return; }
  const co = captchaOpts(); if(!co) return;
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname, ...co}); captchaReset();
  if(error){ toast(authPT(error.message)); return; }
  mailNotice(t('forgotSent'));
}

async function saveNewPass(inputId){
  const pass = document.getElementById(inputId).value;
  if(pass.length < 8){ toast(t('errPass')); return; }
  if(!navigator.onLine){ toast(t('needOnline')); return; }
  const {data, error} = await sb.auth.updateUser({password: pass});
  if(error){ toast(authPT(error.message)); return; }
  document.getElementById(inputId).value = '';
  closeSheet(); toast(t('passChanged'));
  if(!S.user){ const s = await sb.auth.getSession(); if(s.data.session) boot(s.data.session); }
}

async function loadAll(){
  if(!navigator.onLine && loadCache()){ S.offline = true; updateNetBadge(); return; }
  let res = null;
  try{
    res = await Promise.all([
      sb.from('inv_settings').select('*').maybeSingle(),
      sb.from('inv_clients').select('*').order('company'),
      sb.from('inv_invoices').select('*').order('issue_date',{ascending:false}),
      sb.from('inv_banks').select('*').order('created_at'),
      sb.from('inv_expenses').select('*').order('exp_date',{ascending:false})
    ]);
  }catch(e){ res = null; }
  if(!res || res.some(r=>r.error)){
    if(loadCache()){ S.offline = true; updateNetBadge(); return; }

const LIST = {inv_invoices:'invoices', inv_clients:'clients', inv_banks:'banks', inv_expenses:'expenses'};
const newId = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
const qKey = () => 'inv_queue_'+S.user.id;

  localStorage.setItem('inv_cache_'+S.user.id, JSON.stringify({settings:S.settings, clients:S.clients,
    invoices:S.invoices, banks:S.banks, expenses:S.expenses, fx:S.fx, rates:S.rates, at:Date.now()})); }
function loadCache(){
  try{ const c = JSON.parse(localStorage.getItem('inv_cache_'+S.user.id)||'null'); if(!c) return false;
    S.settings = c.settings; S.clients = c.clients||[]; S.invoices = c.invoices||[]; S.banks = c.banks||[];
    S.expenses = c.expenses||[];
    if(!S.fx && c.fx) S.fx = c.fx;
    if(!S.rates && c.rates) S.rates = c.rates;
    return true; }catch(e){ return false; }
}
const isNetErr = e => !navigator.onLine || /fetch|network|load failed|timeout/i.test(String((e&&e.message)||e));
function applyLocal(op){
  if(op.table==='inv_settings'){ if(op.kind==='upsert') S.settings = op.rec; return; }
  const arr = S[LIST[op.table]];
  const i = arr.findIndex(x=>x.id===op.id);
  if(op.kind==='delete'){
    if(i>=0) arr.splice(i,1);
    if(op.table==='inv_clients'){ S.invoices.forEach(v=>{ if(v.client_id===op.id) v.client_id=null; });
      S.expenses.forEach(v=>{ if(v.client_id===op.id) v.client_id=null; }); }
    if(op.table==='inv_invoices') S.expenses.forEach(v=>{ if(v.invoice_id===op.id){ v.invoice_id=null; v.status='pending'; } });
    if(op.table==='inv_banks') S.invoices.forEach(v=>{ if(v.bank_id===op.id) v.bank_id=null; });
  } else {
    const merged = {...(i>=0?arr[i]:{}), ...op.rec};
    if(i>=0) arr[i] = merged; else arr.push(merged);
  }
  if(op.table==='inv_clients') S.clients.sort((a,b)=>(a.company||'').localeCompare(b.company||''));
  if(op.table==='inv_invoices') S.invoices.sort((a,b)=>(b.issue_date||'').localeCompare(a.issue_date||''));
  if(op.table==='inv_expenses') S.expenses.sort((a,b)=>(b.exp_date||'').localeCompare(a.exp_date||''));
}
async function sendOp(op){
  const q = sb.from(op.table);
  const r = op.kind==='delete' ? await q.delete().eq('id',op.id) : await q.upsert(op.rec);
  if(r.error) throw r.error;
}
async function dbWrite(table, kind, rec, id){
  if(table!=='inv_settings' && kind!=='delete' && !hasAccess()){ openPaywall(); throw new Error(t('subNeeded')); }
  const op = {table, kind, rec, id: id || (rec && rec.id)};
  applyLocal(op); saveCache();
  if(!getQueue().length && navigator.onLine){
    try{ await sendOp(op); return 'online'; }
    catch(e){ if(!isNetErr(e)) throw e; }
  }
  setQueue([...getQueue(), op]);
  toast(t('offlineSaved'));
  return 'offline';
}
let syncing = false;
async function syncQueue(){
  if(syncing || !S.user || !navigator.onLine) return;
  if(!getQueue().length){ uploadPendingPhotos(); return; }
  syncing = true;
  try{
    const s = await sb.auth.getSession();
    if(!s.data.session) return;
    S.user = s.data.session.user;
    let q = getQueue();
    while(q.length){
      try{ await sendOp(q[0]); }
      catch(e){ if(!isNetErr(e)) toast(t('syncErr')+(e.message||e)); return; }
      q = q.slice(1); setQueue(q);
    }
    await loadAll(); render(); toast(t('syncDone'));
  } finally { syncing = false; updateNetBadge(); uploadPendingPhotos(); }
}

// ---------- CÁLCULO ----------
function invTotals(inv){
  const t = {}; CURRENCIES.forEach(c=>{ t[c] = {sub:0,vat:0,tot:0}; });
  (inv.lines||[]).forEach(l=>{ const c = normCur(l.currency);
    t[c].sub += (Number(l.qty)||0)*(Number(l.price)||0); });
  const r = inv.vat_rate!=null ? Number(inv.vat_rate)/100 : 0;
  CURRENCIES.forEach(c=>{ t[c].vat = t[c].sub*r; t[c].tot = t[c].sub+t[c].vat; });
  return t;
}
function totalLabel(inv){
  const t = invTotals(inv);
  return CURRENCIES.filter(c=>t[c].tot).map(c=>fmt(t[c].tot,c)).join(' + ')||EUR(0);
}
function convertedTotal(inv){
  const t = invTotals(inv); let sum = 0;
  for(const c of CURRENCIES){ if(!t[c].tot) continue; const v = toEUR(t[c].tot, c); if(v==null) return null; sum += v; }
  return sum;
}
function periodOf(inv){
  const s = inv.period_start || inv.due_date, e = inv.period_end || inv.due_date;
  return s ? {s, e: e&&e>=s ? e : s} : null;
}
function addDaysISO(iso, n){ const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d+n);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
// prazos: cada utilizador define o seu prazo por defeito e regras pelo número da fatura (Definições)
const TERM_OPTS = ['week','7','14','30','45','60'];
const termLbl = v => v==='week' ? t('termsWeek') : t('termsNDays').replace('{n}', v);
const termOpts = sel => TERM_OPTS.map(v=>`<option value="${v}" ${sel===v?'selected':''}>${termLbl(v)}</option>`).join('');
const termsRules = () => (S.settings && Array.isArray(S.settings.terms_rules)) ? S.settings.terms_rules : [];
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function termsFor(number){
  for(const r of termsRules()){
    const m = (r.match||'').trim();
    if(m && new RegExp(`(^|[^A-Z])${reEsc(m)}([^A-Z]|$)`, 'i').test(number||'')) return r.terms || '30';
  }
  return (S.settings && S.settings.default_terms) || '30';
}
function dueOf(inv){
  if(inv.pay_terms){
    if(inv.pay_terms==='week'){
      const base = inv.period_end || inv.issue_date; if(!base) return null;
      const [y,m,d] = base.split('-').map(Number);
      const dow = new Date(y, m-1, d).getDay();
      return addDaysISO(base, 9 - dow);
    }
    const n = inv.pay_terms==='custom' ? (Number(inv.pay_days)||0) : Number(inv.pay_terms);
    return inv.issue_date ? addDaysISO(inv.issue_date, n) : null;
  }
  const p = periodOf(inv); return inv.due_date || (p && p.e) || null;
}
function isLate(inv){ const d = dueOf(inv);
  return inv.status!=='paid' && !!d && d < todayISO(); }
function clientOf(inv){ return S.clients.find(c=>c.id===inv.client_id); }

    </div>`;

  // agrupar por empresa
  const groups = {};
  list.forEach(i=>{ const c=clientOf(i); const k=c?c.company:'(sem cliente)';
    (groups[k]=groups[k]||[]).push(i); });
  let html = banner+filters;
  if(!list.length) html += `<div class="card" style="text-align:center;color:var(--tx2);padding:34px">${t('emptyInv')}</div>`;
  Object.keys(groups).sort().forEach(k=>{
    html += `<div class="grp">${esc(k)}</div>`;
    groups[k].forEach(i=>{
      const late = isLate(i);
      html += `<div class="card inv-item" onclick="editInvoice('${i.id}')">
        <div><b>${esc(i.number)}</b>
          <div style="font-size:13px;color:var(--tx2)">${dmy(i.issue_date)}${(p=>p?` · ${dmy(p.s)}${p.e!==p.s?' → '+dmy(p.e):''}`:'')(periodOf(i))}${dueOf(i)&&i.status!=='paid'?`<br>${t('dueIs')} ${dmy(dueOf(i))}`:''}</div></div>
        <div class="amt"><div style="font-weight:700">${totalLabel(i)}</div>
          <span class="badge ${i.status==='paid'?'paid':late?'late':'unpaid'}">
          ${i.status==='paid'?t('bPaid'):late?t('bLate'):t('bUnpaid')}</span></div></div>`;
    });
  });
  el.innerHTML = html;
}

  el.innerHTML = `<table class="lines-tbl">`+ E.lines.map((l,i)=>`
    <tr><td style="width:44%"><input placeholder="${t('descPh')}" value="${esc(l.desc)}"
        oninput="E.lines[${i}].desc=this.value"></td>
      <td style="width:13%"><input type="number" inputmode="decimal" placeholder="${t('qtyPh')}" value="${l.qty}"
        oninput="E.lines[${i}].qty=this.value;drawTotals()"></td>
      <td style="width:20%"><input type="number" inputmode="decimal" placeholder="${t('pricePh')}" value="${l.price}"
        oninput="E.lines[${i}].price=this.value;drawTotals()"></td>
      <td style="width:17%"><select onchange="E.lines[${i}].currency=this.value;drawTotals()">
        ${curOpts(l.currency)}</select></td>
      <td><button class="del-x" onclick="E.lines.splice(${i},1);drawLines()">✕</button></td></tr>`).join('')+`</table>`;
  drawTotals(); drawExpBox(); drawPresetBox();
}
function drawTotals(){
  const t = invTotals(E); const box = document.getElementById('totals'); let h='';
  const used = CURRENCIES.filter(c=>t[c].sub||((E.lines||[]).some(l=>normCur(l.currency)===c)));
  used.forEach(c=>{
    h += `<div class="tr"><span>${window.t('subtotal')} ${c}</span><span>${fmt(t[c].sub,c)}</span></div>`;
    if(E.vat_rate!=null) h += `<div class="tr"><span>${window.t('vatLbl')} ${E.vat_rate}%</span><span>${fmt(t[c].vat,c)}</span></div>`;
    h += `<div class="tr big"><span>${window.t('total')} ${c}</span><span>${fmt(t[c].tot,c)}</span></div>`; });
  if(E.convert_total && used.some(c=>c!=='EUR')){
    const ct = convertedTotal(E);
    h += ct!=null ? `<div class="tr big" style="color:var(--acc)"><span>${window.t('converted')} (${used.filter(c=>c!=='EUR').map(rateTxt).join(' · ')})</span><span>${EUR(ct)}</span></div>
        <div class="tr" style="color:var(--amber);font-size:12.5px">${window.t('fxWarnApp')}</div>`
      : `<div class="tr" style="color:var(--amber)">${window.t('fxDown')}</div>`;
  }
  box.innerHTML = h || `<div class="tr">${window.t('addLinesHint')}</div>`;
}
async function saveInvoice(){
  E.lines = (E.lines||[]).filter(l=>l.desc||l.price);
  if(E.period_start && E.period_end && E.period_end < E.period_start){
    const x = E.period_start; E.period_start = E.period_end; E.period_end = x; }
  const rec = { id:E.id||newId(), user_id:S.user.id, client_id:E.client_id, number:E.number,
    issue_date:E.issue_date||todayISO(),
    pay_terms:E.pay_terms||termsFor(E.number), pay_days:E.pay_terms==='custom'?(Number(E.pay_days)||0):null,
    due_date:dueOf({...E, issue_date:E.issue_date||todayISO(), pay_terms:E.pay_terms||termsFor(E.number)}),
    period_start:E.period_start||null, period_end:E.period_end||null, status:E.status,
    vat_rate:E.vat_rate, lines:E.lines, notes:E.notes, convert_total:E.convert_total,
    due_mode:E.due_mode==='both'?'both':'converted',
    bank_id:E.bank_id||null, paid_at:E.status==='paid'?(E.paid_at||todayISO()):null };
  const old = S.invoices.find(i=>i.id===rec.id);
  if(old && old.created_at) rec.created_at = old.created_at;
  let mode;
  try{ mode = await dbWrite('inv_invoices','upsert',rec); await linkExpenses(rec); }
  catch(e){ toast('Erro: '+(e.message||e)); await loadAll(); render(); return; }
  E = rec; closeSheet(); render(); if(mode==='online') toast(t('savedInv'));
}
async function setPaid(p){
  E.status = p?'paid':'unpaid'; E.paid_at = p?todayISO():null;
  if(E.id){
    const cur = S.invoices.find(i=>i.id===E.id) || E;
    let mode;
    try{ mode = await dbWrite('inv_invoices','upsert',{...cur, status:E.status, paid_at:E.paid_at}); }
    catch(e){ toast('Erro: '+(e.message||e)); await loadAll(); render(); return; }
    closeSheet(); render(); if(mode==='online') toast(p?t('markedPaid'):t('markedUnpaid')); }
}
async function delInvoice(){
  if(!confirm(t('confirmDelInv'))) return;
  let mode;
  const linked = S.expenses.filter(x=>x.invoice_id===E.id).map(x=>({...x, invoice_id:null, status:'pending'}));
  try{
    for(const x of linked) await dbWrite('inv_expenses','upsert',x);
    mode = await dbWrite('inv_invoices','delete',null,E.id);
  }
  catch(e){ toast('Erro: '+(e.message||e)); await loadAll(); render(); return; }
  closeSheet(); render(); if(mode==='online') toast(t('deletedInv'));
}

// ---------- LETRA DOS PDF ----------
// A Helvetica do jsPDF só tem o alfabeto da Europa Ocidental (WinAnsi). Quando o PDF tem turco, romeno,
// checo, polaco, ₺ etc., usa-se a Noto Sans (OFL), alojada no site. Caso contrário o PDF fica exatamente igual.
let PDF_FONTS = null, PDF_FONTS_P = null;
function ensurePdfFonts(){
  if(PDF_FONTS) return Promise.resolve(PDF_FONTS);
  if(PDF_FONTS_P) return PDF_FONTS_P;
  const get = async n => { const u = new Uint8Array(await (await fetch('fonts/noto-' + n + '.ttf')).arrayBuffer());
    let b = ''; for(let i = 0; i < u.length; i += 0x8000) b += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(b); };
  PDF_FONTS_P = Promise.all([get('regular'), get('bold')]).then(([regular, bold]) => (PDF_FONTS = {regular, bold})).catch(e => { PDF_FONTS_P = null; throw e; });
  return PDF_FONTS_P;
}
const WINANSI_OK = /^[\u0000-\u00ff\u20ac\u201a\u0192\u201e\u2026\u2020\u2021\u02c6\u2030\u0160\u2039\u0152\u017d\u2018\u2019\u201c\u201d\u2022\u2013\u2014\u02dc\u2122\u0161\u203a\u0153\u017e\u0178]*$/;
const pdfMoney = (loc, v, cur) => new Intl.NumberFormat(loc, {style:'currency', currency:cur}).format(v||0).replace(/\u202f/g, '\u00a0');
function newPdf(sample){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  if(PDF_FONTS && !WINANSI_OK.test(sample)){
    doc.addFileToVFS('noto-regular.ttf', PDF_FONTS.regular); doc.addFont('noto-regular.ttf', 'Noto', 'normal');
    doc.addFileToVFS('noto-bold.ttf', PDF_FONTS.bold); doc.addFont('noto-bold.ttf', 'Noto', 'bold');
    const set = doc.setFont.bind(doc);
    doc.setFont = (f, st) => set('Noto', /bold/.test(st||'') ? 'bold' : 'normal');
    set('Noto', 'normal');
  }
  return doc;
}

function buildPDF(){
  const c = clientOf(E)||{}; const st = S.settings; const T = invTotals(E);
  const P = PDFL[c.language] || PDFL.en;
  const money = (v,cur) => pdfMoney(P.locale, v, cur);
  const doc = newPdf(JSON.stringify([E, c, st, P, S.banks, FOOT_MARK[c.language]||'']) + CURRENCIES.filter(k=>T[k].tot).map(k=>money(1234.5,k)).join(''));
  const hasId = v => { const x=(v||'').trim(); return x && x!=='0' && x!=='-'; };
  const W=210, H=297, M=18, CW=W-2*M;
  const INK=[30,33,40], MUTED=[115,120,130], LINE=[226,228,234], ACC=[47,92,190];
  const col = a => doc.setTextColor(a[0],a[1],a[2]);
  const font = (style,size) => { doc.setFont('helvetica',style); doc.setFontSize(size); };
  const lh = size => size*0.42;
  let y = 0;
  const ensure = need => { if(y+need > H-22){ doc.addPage(); y = 22; return true; } return false; };

  doc.setFillColor(ACC[0],ACC[1],ACC[2]); doc.rect(0,0,W,4,'F');

  y = 22;
  font('bold',28); col(INK); doc.text(P.title, M, y);
  if(E.status==='paid'){
    const tw = doc.getTextWidth(P.title);
    doc.setDrawColor(46,160,100); doc.setLineWidth(0.6);
    font('bold',11); const pw = doc.getTextWidth(P.paid)+8;
    doc.roundedRect(M+tw+6, y-7, pw, 8.5, 1.5, 1.5, 'S');
    doc.setTextColor(46,160,100); doc.text(P.paid, M+tw+10, y-1.2);
    doc.setLineWidth(0.2);
  }
  const meta = [[P.no, E.number],[P.date, dmy(E.issue_date)]];
  const pp = periodOf(E);
  if(pp) meta.push([P.period, pp.e!==pp.s ? `${dmy(pp.s)} - ${dmy(pp.e)}` : dmy(pp.s)]);
  const dd = dueOf(E);
  if(dd) meta.push([P.dueDate, dmy(dd)]);
  let my = 13;
  meta.forEach(([k,v])=>{
    font('normal',8.5); col(MUTED); doc.text(k.toUpperCase(), W-M-62, my);
    font('bold',10); col(INK); doc.text(String(v), W-M, my, {align:'right'});
    my += 5.6;
  });
  y = Math.max(y, my) + 6;
  doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.line(M, y, W-M, y);
  y += 9;

  const colW = CW/2 - 6, xL = M, xR = M + CW/2 + 6;
  function party(x, label, name, lines){
    let yy = y;
    font('bold',8); col(MUTED); doc.text(label, x, yy); yy += 5.5;
    // Fit company names on one line where possible, while keeping a readable minimum.
    let nameSize = 11;
    font('bold',nameSize); col(INK);
    while(nameSize > 8 && doc.getTextWidth(name||'') > colW){
      nameSize -= 0.25; font('bold',nameSize);
    }
    doc.splitTextToSize(name||'', colW).forEach(l=>{ doc.text(l, x, yy); yy += lh(nameSize)+1; });
    font('normal',9.5); col([70,75,85]);
    lines.filter(s=>(s||'').trim()).forEach(txt=>{
      doc.splitTextToSize(txt.trim(), colW).forEach(l=>{ doc.text(l, x, yy); yy += lh(9.5)+0.9; });
    });
    return yy;
  }
  const fromLines = [...(st.address||'').split('\n')];
  if(hasId(st.nif)) fromLines.push(`${P.nif}: ${st.nif}`);
  const toLines = [c.contact_name||'', ...(c.address||'').split('\n')];
  if(hasId(c.nif)) toLines.push(`${P.nif}: ${c.nif}`);
  const yA = party(xL, P.from, st.business_name, fromLines);
  const yB = party(xR, P.to, c.company, toLines);
  y = Math.max(yA, yB) + 8;

  const xQty = M+112, xPrice = M+142, xTot = W-M-3, descW = 100;
  function tableHead(){
    doc.setFillColor(INK[0],INK[1],INK[2]); doc.rect(M, y, CW, 8, 'F');
    font('bold',8); doc.setTextColor(255,255,255);
    doc.text(P.desc, M+3, y+5.3);
    doc.text(P.qty, xQty, y+5.3, {align:'right'});
    doc.text(P.price, xPrice, y+5.3, {align:'right'});
    doc.text(P.total, xTot, y+5.3, {align:'right'});
    y += 8;
  }
  tableHead();
  (E.lines||[]).forEach((l,i)=>{
    font('normal',10);
    const dl = doc.splitTextToSize(String(l.desc||''), descW);
    const rh = Math.max(8, dl.length*(lh(10)+0.8) + 4);
    if(ensure(rh)) tableHead();
    if(i%2===1){ doc.setFillColor(247,248,250); doc.rect(M, y, CW, rh, 'F'); }
    col(INK); font('normal',10);
    dl.forEach((t,k)=> doc.text(t, M+3, y+5.3 + k*(lh(10)+0.8)));
    const cur = normCur(l.currency);
    const q = Number(l.qty)||0, pr = Number(l.price)||0;
    doc.text(String(q), xQty, y+5.3, {align:'right'});
    doc.text(money(pr,cur), xPrice, y+5.3, {align:'right'});
    font('bold',10); doc.text(money(q*pr,cur), xTot, y+5.3, {align:'right'});
    y += rh;
    doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.line(M, y, W-M, y);
  });
  y += 8;

  const bx = W-M-86, bw = 86;
  const rows = [];
  CURRENCIES.forEach(cur=>{ if(!T[cur].tot) return;
    if(E.vat_rate!=null){
      rows.push({l:`${P.sub} ${cur}`, v:money(T[cur].sub,cur)});
      rows.push({l:`${P.vat} ${E.vat_rate}% ${cur}`, v:money(T[cur].vat,cur)});
    }
    rows.push({l:`${P.totalCur} ${cur}`, v:money(T[cur].tot,cur), b:true});
  });
  const foreign = CURRENCIES.filter(c=>c!=='EUR' && T[c].tot);
  const showConv = E.convert_total && foreign.length && convertedTotal(E)!=null;
  if(showConv){
    rows.push({sep:true});
    rows.push({l:P.conv, v:money(convertedTotal(E),'EUR'), b:true});
    foreign.forEach(c=> rows.push({l:`${P.rate}: ${rateTxt(c)}`, v:'', small:true}));
  }
  const dueLines = (showConv && E.due_mode!=='both') ? [money(convertedTotal(E),'EUR')]
    : CURRENCIES.filter(cur=>T[cur].tot).map(cur=>money(T[cur].tot,cur));
  if(!dueLines.length) dueLines.push(money(0,'EUR'));
  ensure(rows.length*7 + dueLines.length*7 + 16);
  rows.forEach(r=>{
    if(r.sep){ doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.line(bx+4, y-3.5, W-M-4, y-3.5); y += 2; return; }
    if(r.small){ font('italic',8); col(MUTED); doc.text(r.l, bx+4, y); y += 5; return; }
    font(r.b?'bold':'normal', r.b?10.5:9.5); col(r.b?INK:[80,85,95]);
    doc.text(r.l, bx+4, y); doc.text(r.v, W-M-4, y, {align:'right'});
    y += 6.5;
  });
  y += 1;
  const dh = 6 + dueLines.length*7;
  doc.setFillColor(ACC[0],ACC[1],ACC[2]); doc.roundedRect(bx, y, bw, dh, 1.5, 1.5, 'F');
  doc.setTextColor(255,255,255); font('bold',9); doc.text(P.due, bx+4, y+7.4);
  font('bold',13);
  dueLines.forEach((d,k)=> doc.text((k?'+ ':'')+d, W-M-4, y+7.4 + k*7, {align:'right'}));
  y += dh + 6;

  if(showConv){
    font('italic',8.2);
    const wl = doc.splitTextToSize(P.fxwarn, CW-8);
    const wh = wl.length*(lh(8.2)+0.8) + 5;
    ensure(wh+4);
    doc.setFillColor(253,246,227); doc.rect(M, y, CW, wh, 'F');
    doc.setFillColor(214,160,40); doc.rect(M, y, 1.2, wh, 'F');
    doc.setTextColor(120,90,20);
    wl.forEach((l,k)=> doc.text(l, M+4, y+4.6 + k*(lh(8.2)+0.8)));
    y += wh + 7;
  }

  if((E.notes||'').trim()){
    font('normal',9.5);
    const nl = doc.splitTextToSize(E.notes.trim(), CW);
    ensure(nl.length*(lh(9.5)+0.9) + 10);
    font('bold',8); col(MUTED); doc.text(P.notes, M, y); y += 5;
    font('normal',9.5); col([60,65,75]);
    nl.forEach(l=>{ doc.text(l, M, y); y += lh(9.5)+0.9; });
    y += 6;
  }

  const bank = (S.banks||[]).find(b=>b.id===E.bank_id);
  const pr = [];
  if(bank){
    if(bank.bank_name) pr.push([P.bank, bank.bank_name]);
    if(bank.holder)    pr.push([P.holder, bank.holder]);
    if(bank.iban)      pr.push(['IBAN', bank.iban]);
    if(bank.swift)     pr.push(['SWIFT / BIC', bank.swift]);
    if(bank.extra)     pr.push(['', bank.extra]);
  } else if((st.iban||'').trim()){ pr.push(['IBAN', st.iban]); }
  const pt = E.pay_terms || termsFor(E.number);
  const ptxt = pt==='week' ? P.termsWeek
    : P.termsDays.replace('{n}', pt==='custom' ? (Number(E.pay_days)||0) : pt);
  pr.push([P.terms, dd ? `${ptxt} (${P.dueDate.toLowerCase()} ${dmy(dd)})` : ptxt]);
  if(pr.length){
    const ph = 10 + pr.length*5.6;
    ensure(ph+4);
    doc.setFillColor(245,246,249); doc.rect(M, y, CW, ph, 'F');
    font('bold',8); col(MUTED); doc.text(P.pay, M+4, y+6);
    let yy = y+12;
    pr.forEach(([k,v])=>{
      font('normal',9); col(MUTED); doc.text(k, M+4, yy);
      font('bold',9.5); col(INK); doc.text(String(v), M+38, yy);
      yy += 5.6;
    });
    y += ph + 4;
  }

  const n = doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.line(M, H-14, W-M, H-14);
    font('normal',7.5); col(MUTED);
    const left = [st.business_name, hasId(st.nif)?`${P.nif}: ${st.nif}`:'', st.extra].filter(Boolean).join('  ·  ');
    doc.text(doc.splitTextToSize(left, CW-30)[0]||'', M, H-9);
    doc.text(`${P.page} ${i}/${n}`, W-M, H-9, {align:'right'});
    // marca discreta da Paidsmith (não aparece nas faturas do administrador)
    if(!S.isAdmin){ font('normal',6.5); doc.setTextColor(190,194,204);
      doc.text(FOOT_MARK[c.language] || FOOT_MARK.en, W-M, H-4.5, {align:'right'});
      font('normal',7.5); col(MUTED); }
  }
  return doc;
}

function defaultTemplate(lang){ return (EMAIL_L[lang] || EMAIL_L.en).template; }
function buildEmail(){
  const c = clientOf(E)||{}; const lang = LANGS.includes(c.language) ? c.language : 'en';
  let body = (c.email_template&&c.email_template.trim()) ? c.email_template : defaultTemplate(lang);
  const ct = E.convert_total && E.due_mode!=='both' ? convertedTotal(E) : null;
  const total = ct!=null && CURRENCIES.some(c=>c!=='EUR' && invTotals(E)[c].tot) ? EUR(ct) : totalLabel(E);
  body = body.replaceAll('{numero}',E.number).replaceAll('{total}',total)
    .replaceAll('{vencimento}',dmy(dueOf(E))).replaceAll('{empresa}',S.settings.business_name||'')
    .replaceAll('{cliente}',c.company||'');
  const subject = `${(EMAIL_L[lang]||EMAIL_L.en).subjectWord} ${E.number} — ${S.settings.business_name||''}`;
  return {subject, body, emails:(c.emails||[])};
}
async function sharePDF(){
  await ensurePdfFonts().catch(()=>{});
  const m = buildEmail();
  const blob = buildPDF().output('blob');
  const file = new File([blob], pdfName(), {type:'application/pdf'});
  const files = [file];
  const exps = invoiceExpenses(E).filter(x=>(x.photos||[]).length);
  if(exps.length){
    try{ const rb = (await buildReceiptsPDF(exps, E)).output('blob');
      files.push(new File([rb], receiptsName(E), {type:'application/pdf'})); }catch(e){}
  }
  if(navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files, title:m.subject, text:m.body}); }
    catch(e){ /* cancelado */ }

    buildPDF().save(pdfName());
    if(files[1]) downloadBlob(files[1], files[1].name);
    openMailto();
    toast(t('pdfFallback'));
  }
}

// ---------- CALENDÁRIO ----------
function rCalendar(){
  const el = document.getElementById('v-cal');
  const y=S.calY, m=S.calM;
  const first = new Date(y,m,1); const start=first.getDay(); // dom=0
  const days = new Date(y,m+1,0).getDate();
  const mn = first.toLocaleDateString(t('locale'),{month:'long',year:'numeric'});
  const mon = `${y}-${String(m+1).padStart(2,'0')}`;
  const daysInM = new Date(y,m+1,0).getDate();
  const byDay = {}; const inMonth = new Set();
  S.invoices.forEach(i=>{ const p = periodOf(i); if(!p) return;
    for(let d=1; d<=daysInM; d++){
      const iso = `${mon}-${String(d).padStart(2,'0')}`;
      if(iso>=p.s && iso<=p.e){ (byDay[d]=byDay[d]||[]).push(i); }
    }});
  const payDay = {};
  S.invoices.forEach(i=>{ const d = dueOf(i); const p = periodOf(i);
    if(!d || d.slice(0,7)!==mon) return;
    inMonth.add(i.id);
    if(p && d===p.e) return;
    (payDay[parseInt(d.slice(8))] = payDay[parseInt(d.slice(8))] || []).push(i); });
  const td = todayISO();
  function isoWeek(date){
    const dt = new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
    const day = (dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-day+3);
    const jan4 = new Date(Date.UTC(dt.getUTCFullYear(),0,4));
    return 1+Math.round(((dt-jan4)/86400000 - 3 + ((jan4.getUTCDay()+6)%7))/7);
  }
  const localISO = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  const wkNum = sunD => isoWeek(sunD);
  function weekCell(sunDate){
    const sun = localISO(sunDate);
    const satD = new Date(sunDate); satD.setDate(satD.getDate()+6);
    const now = td>=sun && td<=localISO(satD);
    return `<div class="cal-wk ${now?'now':''}">W${wkNum(sunDate)}</div>`;
  }
  const curSatD = new Date(); curSatD.setDate(curSatD.getDate() - curSatD.getDay());
  const curSat = localISO(curSatD);
  const curFriD = new Date(curSatD); curFriD.setDate(curFriD.getDate()+6);
  const curFri = localISO(curFriD);
  let grid = `<div class="cal-dow" style="font-size:10px">${t('weekAbbr')}</div>`
    + t('dows').map(d=>`<div class="cal-dow">${d}</div>`).join('');
  grid += weekCell(new Date(y,m,1-start));
  for(let i=0;i<start;i++) grid+=`<div></div>`;
  for(let d=1;d<=days;d++){
    if(d>1 && (start+d-1)%7===0) grid += weekCell(new Date(y,m,d));
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const inWk = iso>=curSat && iso<=curFri;
    const invs = byDay[d]||[]; const pays = payDay[d]||[];
    grid += `<div class="cal-day ${iso===td?'today':''} ${inWk?'wk-now':''}" ${(invs.length||pays.length)?`onclick="dayDetail('${iso}')"`:''}>
      <span class="n">${d}</span>
      ${invs.map(i=>{ const p=periodOf(i);
        const cls = i.status==='paid'?'paid': isLate(i)?'late':'due';
        const lbl = (p && iso===p.e) ? totalLabel(i) : '&nbsp;';
        return `<span class="dot ${cls}">${lbl}</span>`; }).join('')}
      ${pays.map(i=>{ const cls = i.status==='paid'?'paid': isLate(i)?'late':'pay';
        return `<span class="dot ${cls}">${t('payShort')} ${totalLabel(i)}</span>`; }).join('')}</div>`;
  }
  // resumo do mês (cada fatura conta uma vez, mesmo ocupando vários dias)
  const msum = {}; let ml=0;
  S.invoices.filter(i=>inMonth.has(i.id)).forEach(i=>{ if(i.status!=='paid'){ const t=invTotals(i);
    CURRENCIES.forEach(c=>{ msum[c]=(msum[c]||0)+t[c].tot; }); if(isLate(i))ml++; }});
  const p = curParts(msum);
  const now = new Date();
  const todayLine = `${t('todayWord')}: ${now.toLocaleDateString(t('locale'),{weekday:'long'})}, ${dmy(td)} · ${t('weekWord')} ${wkNum(curSatD)}`;
  el.innerHTML = `
  <div class="banner"><div style="color:var(--acc);font-weight:700;margin-bottom:4px;text-transform:capitalize">${todayLine}</div>
    ${t('thisMonth')} <b>${p.join(' + ')||t('nothing')}</b>
    ${ml?`<div style="color:var(--amber);margin-top:4px">⚠ ${ml} ${t('lateN')}</div>`:''}</div>
  <div class="cal-head">
    <button class="btn-g" onclick="calNav(-1)">‹</button>
    <h3>${mn.charAt(0).toUpperCase()+mn.slice(1)}</h3>
    <button class="btn-g" onclick="calNav(1)">›</button></div>
  <div class="cal-grid">${grid}</div>
  <div class="legend"><span><i style="background:var(--green)"></i>${t('legPaid')}</span>
    <span><i style="background:var(--amber)"></i>${t('legDue')}</span>
    <span><i style="background:var(--red)"></i>${t('legLate')}</span>
    <span><i style="background:transparent;border:1px dashed var(--acc)"></i>${t('legPay')}</span></div>`;
}
function calNav(d){ S.calM+=d; if(S.calM<0){S.calM=11;S.calY--;} if(S.calM>11){S.calM=0;S.calY++;} rCalendar(); }
function dayDetail(iso){
  const invs = S.invoices.filter(i=>{ const p=periodOf(i); return (p && iso>=p.s && iso<=p.e) || dueOf(i)===iso; });
  openSheet(`<h2>${t('dueOn')} ${dmy(iso)}</h2>`+ invs.map(i=>{ const c=clientOf(i);
    return `<div class="card inv-item" onclick="closeSheet();editInvoice('${i.id}')">
      <div><b>${esc(i.number)}</b><div style="font-size:13px;color:var(--tx2)">${esc(c?c.company:'')}</div></div>
      <div class="amt"><div style="font-weight:700">${totalLabel(i)}</div>
      <span class="badge ${i.status==='paid'?'paid':isLate(i)?'late':'unpaid'}">${i.status==='paid'?t('bPaid'):isLate(i)?t('bLate'):t('bUnpaid')}</span></div></div>`;}).join('')
    +`<div class="row" style="margin-top:12px"><button class="btn-g" onclick="closeSheet()">${t('closeBtn')}</button></div>`);
}

// ---------- RESUMO ----------
function rSummary(){
  const el = document.getElementById('v-sum');
  const y = S.sumY;
  const inEUR = t => CURRENCIES.reduce((a,c)=> a + (t[c].tot ? (toEUR(t[c].tot,c) ?? 0) : 0), 0);
  const inYear = S.invoices.filter(i => (i.issue_date||'').slice(0,4) === String(y));
  const mon = todayISO().slice(0,7);
  const zero = () => ({eur:0, cur:{}, n:0});
  const g = {all:zero(), paid:zero(), due:zero(), late:zero(), month:zero()};
  const add = (b, i) => { const t = invTotals(i);
    CURRENCIES.forEach(c=>{ if(t[c].tot) b.cur[c] = (b.cur[c]||0) + t[c].tot; }); b.eur += inEUR(t); b.n++; };
  const byCo = {};
  inYear.forEach(i => {
    add(g.all, i);
    add(i.status==='paid' ? g.paid : isLate(i) ? g.late : g.due, i);
    if((i.issue_date||'').slice(0,7) === mon) add(g.month, i);
    const c = clientOf(i); const k = c ? c.company : '—';
    const r = byCo[k] = byCo[k] || {tot:0, paid:0, open:0};
    const v = inEUR(invTotals(i));
    r.tot += v; if(i.status==='paid') r.paid += v; else r.open += v;
  });
  const owed = g.due.eur + g.late.eur;
  const pct = g.all.eur ? Math.round(g.paid.eur / g.all.eur * 100) : 0;
  const split = b => curParts(b.cur).join(' + ') || EUR(0);

  const segs = [
    {k:'paid', v:g.paid.eur, c:'var(--green)', l:t('sumPaid'), b:g.paid},
    {k:'due',  v:g.due.eur,  c:'var(--amber)', l:t('sumDue'),  b:g.due},
    {k:'late', v:g.late.eur, c:'var(--red)',   l:t('sumLate'), b:g.late},
  ];
  const R = 70, C = 2*Math.PI*R;
  let off = 0, arcs = '';
  if(g.all.eur > 0){
    segs.forEach(s => { if(!s.v) return;
      const len = s.v / g.all.eur * C;
      arcs += `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${s.c}" stroke-width="22"
        stroke-dasharray="${Math.max(len-2,0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`;
      off += len; });
  } else {
    arcs = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--line)" stroke-width="22"/>`;
  }
  const donut = `<svg viewBox="0 0 180 180" width="200" height="200" role="img" aria-label="${t('sumTitle')}">
    ${arcs}
    <text x="90" y="84" text-anchor="middle" fill="var(--tx2)" font-size="11">${t('sumEarned')}</text>
    <text x="90" y="102" text-anchor="middle" fill="var(--tx)" font-size="17" font-weight="700">${EUR(g.all.eur)}</text>
    <text x="90" y="119" text-anchor="middle" fill="var(--green)" font-size="11" font-weight="700">${pct}% ${t('sumPaidPct')}</text>
  </svg>`;

  const legend = segs.map(s => `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)">
      <div><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${s.c};margin-right:7px"></i>${s.l}
        <div style="font-size:12px;color:var(--tx2);margin-left:17px">${s.b.n} ${s.b.n===1?t('invoice'):t('invoices')} · ${split(s.b)}</div></div>
      <b>${EUR(s.v)}</b></div>`).join('');

  const card = (lbl, val, sub, color) => `<div class="card" style="flex:1;min-width:140px;margin:0">
    <div style="font-size:12px;color:var(--tx2)">${lbl}</div>
    <div style="font-size:20px;font-weight:700;margin-top:4px;color:${color||'var(--tx)'}">${val}</div>
    <div style="font-size:12px;color:var(--tx2);margin-top:2px">${sub}</div></div>`;

  const coRows = Object.keys(byCo).sort((a,b)=>byCo[b].tot-byCo[a].tot).map(k => { const r = byCo[k];
    return `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between"><b style="font-size:14px">${esc(k)}</b><b>${EUR(r.tot)}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-top:3px">
        <span style="color:var(--green)">${t('sumPaid')}: ${EUR(r.paid)}</span>
        <span style="color:${r.open?'var(--amber)':'var(--tx2)'}">${t('sumOwed')}: ${EUR(r.open)}</span></div></div>`; }).join('');

  el.innerHTML = `
  <div class="cal-head">
    <button class="btn-g" onclick="S.sumY--;rSummary()">‹</button>
    <h3>${t('sumYear')} ${y}</h3>
    <button class="btn-g" onclick="S.sumY++;rSummary()">›</button></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
    ${card(t('sumEarned'), EUR(g.all.eur), `${g.all.n} ${g.all.n===1?t('invoice'):t('invoices')}`)}
    ${card(t('sumPaid'), EUR(g.paid.eur), `${pct}%`, 'var(--green)')}
    ${card(t('sumOwed'), EUR(owed), g.late.n ? `⚠ ${g.late.n} ${t('lateN')}` : '—', owed?'var(--amber)':null)}
    ${y===new Date().getFullYear() ? card(t('sumMonth'), EUR(g.month.eur), `${g.month.n} ${g.month.n===1?t('invoice'):t('invoices')}`) : ''}
  </div>
  <div class="card" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center">
    <div>${donut}</div>
    <div style="flex:1;min-width:220px">${legend}</div>
  </div>
  ${coRows ? `<div class="card"><h3 style="margin-bottom:4px;font-size:15px">${t('sumByCo')}</h3>${coRows}</div>` : ''}
  <p class="hint">${t('sumNote')}${S.rates?'':' '+t('sumNoFx')}</p>`;
}

async function saveSettings(){
  const g = id=>document.getElementById(id).value;
  const rec = {user_id:S.user.id, business_name:g('st-name'), address:g('st-addr'),
    nif:g('st-nif'), iban:S.settings.iban||'', extra:g('st-extra'), default_vat:Number(g('st-vat'))||0,

    terms_rules:termsRules(), updated_at:new Date().toISOString()};
  let mode;
  try{ mode = await dbWrite('inv_settings','upsert',rec,S.user.id); }
  catch(e){ toast('Erro: '+(e.message||e)); return; }

// ---------- LINHAS PREDEFINIDAS ----------
const presets = () => (S.settings && Array.isArray(S.settings.line_presets)) ? S.settings.line_presets : [];
const cleanLines = ls => (ls||[]).filter(l=>!l.exp_id && ((l.desc||'').trim() || (l.price!=='' && l.price!=null)))
  .map(l=>({desc:l.desc||'', qty:(l.qty===''||l.qty==null)?1:l.qty, price:(l.price==null?'':l.price), currency:normCur(l.currency)}));
const linesBlank = ls => !cleanLines(ls).length;
// fatura nova: põe as linhas do cliente; troca se mudares de cliente e ainda não mexeste nelas
function applyClientPreset(){
  const p = presets().find(x=>x.client_id && x.client_id===E.client_id);
  const untouched = E._autoPreset && JSON.stringify(cleanLines(E.lines))===E._autoPreset;
  if(!linesBlank(E.lines) && !untouched) return false;
  const keepExp = (E.lines||[]).filter(l=>l.exp_id);
  if(!p){ if(!untouched) return false;
    E.lines = [{desc:'',qty:1,price:'',currency:'EUR'}, ...keepExp]; E._autoPreset = null; return true; }
  E.lines = [...JSON.parse(JSON.stringify(p.lines)), ...keepExp];
  E._autoPreset = JSON.stringify(cleanLines(E.lines));
  return true;
}
function drawPresetBox(){
  const el = document.getElementById('preset-box'); if(!el || !E) return;
  const ps = presets();
  el.innerHTML = (ps.length ? `<select style="margin-top:8px" onchange="if(this.value){usePreset(this.value);}">
      <option value="">${t('presetPick')}</option>
      ${ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>` : '')
    + `<button class="btn-g" style="margin-top:8px" onclick="savePresetFromInvoice()">${t('presetSave')}</button>`;
}
function usePreset(pid){
  const p = presets().find(x=>x.id===pid); if(!p) return;
  const keepExp = (E.lines||[]).filter(l=>l.exp_id);
  const own = (E.lines||[]).filter(l=>!l.exp_id);
  E.lines = [...(linesBlank(own) ? [] : own), ...JSON.parse(JSON.stringify(p.lines)), ...keepExp];
  drawLines();
}
async function writePresets(list){
  const rec = {...S.settings, user_id:S.user.id, line_presets:list, updated_at:new Date().toISOString()};
  return dbWrite('inv_settings','upsert',rec,S.user.id);
}
async function savePresetFromInvoice(){
  const lines = cleanLines(E.lines);
  if(!lines.length){ toast(t('presetNoLines')); return; }
  const c = clientOf(E);
  const name = (prompt(t('presetName'), c ? c.company : '')||'').trim(); if(!name) return;
  let list = presets().slice();
  const same = list.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(same && !confirm(t('presetOverwrite').replace('{n}',same.name))) return;
  const auto = !!c && confirm(t('presetAuto').replace('{c}', c.company));
  if(auto) list = list.map(p=>p.client_id===c.id ? {...p, client_id:null} : p);
  const rec = {id: same ? same.id : newId(), name, client_id: auto ? c.id : (same ? same.client_id : null), lines};
  list = same ? list.map(p=>p.id===same.id ? rec : p) : [...list, rec];
  try{ const mode = await writePresets(list); drawPresetBox(); if(mode==='online') toast(t('presetSaved')); }
  catch(e){ toast('Erro: '+(e.message||e)); }
}
async function setPresetClient(pid, cid){
  const list = presets().map(p=> p.id===pid ? {...p, client_id:cid||null} : (cid && p.client_id===cid ? {...p, client_id:null} : p));
  try{ await writePresets(list); render(); }catch(e){ toast('Erro: '+(e.message||e)); }
}
async function renamePreset(pid){
  const p = presets().find(x=>x.id===pid); if(!p) return;
  const name = (prompt(t('presetName'), p.name)||'').trim(); if(!name) return;
  try{ await writePresets(presets().map(x=>x.id===pid?{...x,name}:x)); render(); }catch(e){ toast('Erro: '+(e.message||e)); }
}
async function delPreset(pid){
  if(!confirm(t('presetConfirmDel'))) return;
  try{ await writePresets(presets().filter(x=>x.id!==pid)); render(); }catch(e){ toast('Erro: '+(e.message||e)); }
}
async function saveTerms(patch, rerender){
  const rec = {...S.settings, user_id:S.user.id, ...patch, updated_at:new Date().toISOString()};
  let mode;
  try{ mode = await dbWrite('inv_settings','upsert',rec,S.user.id); }
  catch(e){ toast('Erro: '+(e.message||e)); return; }
  S.settings = {...S.settings, ...patch};
  if(rerender) render();
  if(mode==='online') toast(t('savedSet'));
}
function setRule(i, k, v){ const rs = termsRules().map(r=>({...r})); rs[i][k] = k==='match' ? v.trim() : v; saveTerms({terms_rules:rs}); }
function addRule(){ saveTerms({terms_rules:[...termsRules(), {match:'', terms:'week'}]}, true); }
function delRule(i){ saveTerms({terms_rules:termsRules().filter((_,j)=>j!==i)}, true); }
async function saveExpInv(on){
  const rec = {...S.settings, user_id:S.user.id, exp_invoice:!!on, updated_at:new Date().toISOString()};
  let mode;
  try{ mode = await dbWrite('inv_settings','upsert',rec,S.user.id); }
  catch(e){ toast('Erro: '+(e.message||e)); return; }
  if(mode==='online') toast(t('savedSet'));
}

const mdLite = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
function openHelp(tab){
  S.helpTab = tab || S.helpTab || 'ai';
  const tabs = [['ai', t('helpAi')], ['msg', t('helpMsg')], ['faq', t('helpFaq')]];
  openSheet(`<h2>${t('helpTitle')}</h2>
    <div class="chips">${tabs.map(([k,l])=>`<span class="chip ${S.helpTab===k?'on':''}" onclick="openHelp('${k}')">${l}</span>`).join('')}</div>
    <div id="help-body"></div>`);
  if(S.helpTab==='ai') drawChat(); else if(S.helpTab==='faq') drawFaq(); else drawFeedbackForm();
}
function drawFaq(note){
  const el = document.getElementById('help-body'); if(!el) return;
  el.innerHTML = (note ? `<div class="card" style="border-color:rgba(255,159,67,.45)">${note}</div>` : '') +
    (FAQ[L]||FAQ.en).map(([q,a])=>`<details class="card" style="margin-top:8px"><summary style="cursor:pointer;font-weight:700">${esc(q)}</summary><p style="margin:8px 0 0;color:var(--tx2)">${esc(a)}</p></details>`).join('') +
    `<button class="btn-g" style="width:100%;margin-top:12px" onclick="openHelp('msg')">${t('helpAskTeam')}</button>`;
}
function drawChat(){
  const el = document.getElementById('help-body'); if(!el) return;
  const sugg = (FAQ[L]||FAQ.en).slice(0,3).map(([q])=>q);
  el.innerHTML = `<p class="hint" style="margin-top:0">${t('aiIntro')}</p>
    <div id="chat-log" style="display:flex;flex-direction:column;gap:8px;margin:10px 0;max-height:46vh;overflow-y:auto">
      ${S.chat.length ? S.chat.map(m=>`<div class="bubble ${m.role}">${m.role==='user'?esc(m.content):mdLite(m.content)}</div>`).join('')
        : `<div class="chips" style="margin:0">${sugg.map((q,i)=>`<span class="chip" data-q="${i}" onclick="askAi((FAQ[L]||FAQ.en)[this.dataset.q][0])">${esc(q)}</span>`).join('')}</div>`}
      ${S.chatBusy ? `<div class="bubble assistant" style="opacity:.7">${t('aiThinking')}</div>` : ''}
    </div>
    <div class="row"><textarea id="chat-in" rows="2" maxlength="1000" placeholder="${t('aiPh')}" style="flex:4"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();askAi()}"></textarea>
      <button class="btn-p" style="flex:1;align-self:stretch" onclick="askAi()" ${S.chatBusy?'disabled':''}>${t('aiSend')}</button></div>
    <p class="hint">${t('aiPrivacy')}</p>`;
  const log = document.getElementById('chat-log'); log.scrollTop = log.scrollHeight;
}
async function askAi(text){
  const inp = document.getElementById('chat-in');
  const q = (text || (inp && inp.value) || '').trim();
  if(!q || S.chatBusy) return;
  if(!navigator.onLine){ toast(t('needOnline')); return; }
  S.chat.push({role:'user', content:q}); S.chatBusy = true; drawChat();
  let err = null;
  try{
    const {data, error} = await sb.functions.invoke('ps-assistant', {body:{lang:L, messages:S.chat.slice(-8)}});
    if(error){
      let code = ''; try{ code = (await error.context.json()).error; }catch(e){}
      err = code || 'ai_unavailable';
    } else if(data && data.answer) S.chat.push({role:'assistant', content:data.answer});
    else err = 'ai_unavailable';
  }catch(e){ err = 'ai_unavailable'; }
  S.chatBusy = false;
  if(err){
    S.chat.pop();
    S.helpTab = 'faq'; openHelp('faq');
    drawFaq(err==='limit' ? t('aiLimit') : t('aiDown'));
    return;
  }
  drawChat();
}

const TUT = [
  {sel:null, view:'inv', k:'tut0'},
  {sel:'#tabs button[data-v=inv]', view:'inv', k:'tut1'},
  {sel:'#fab', view:'inv', k:'tut2'},

let tutI = 0;
function maybeStartTutorial(){
  if(!S.user || !S.settings) return;
  if(S.settings.tutorial_done || localStorage.getItem('inv_tut_'+S.user.id)) return;
  setTimeout(()=>startTutorial(), 700);
}
function startTutorial(){ closeSheet(); tutI = 0; drawTut(); window.addEventListener('resize', drawTut); }
function endTutorial(){
  document.getElementById('tut')?.remove(); window.removeEventListener('resize', drawTut);
  localStorage.setItem('inv_tut_'+S.user.id, '1');
  if(!S.settings.tutorial_done){
    S.settings.tutorial_done = true;
    dbWrite('inv_settings','upsert',{...S.settings, user_id:S.user.id, tutorial_done:true, updated_at:new Date().toISOString()}).catch(()=>{});
  }
  go('inv');
}
function tutGo(d){ tutI = Math.max(0, Math.min(TUT.length-1, tutI+d)); drawTut(); }
function drawTut(){
  const st = TUT[tutI]; if(S.view !== st.view) go(st.view);
  let box = document.getElementById('tut');
  if(!box){ box = document.createElement('div'); box.id = 'tut'; document.body.appendChild(box); }
  const el = st.sel && document.querySelector(st.sel);
  const r = el ? el.getBoundingClientRect() : null;
  const pad = 6, last = tutI === TUT.length-1;
  const ring = r ? `<div class="tut-ring" style="left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px"></div>`
                 : `<div class="tut-dim"></div>`;
  const W = Math.min(340, innerWidth-24);
  let top, left = Math.max(12, Math.min(innerWidth-W-12, r ? r.left + r.width/2 - W/2 : (innerWidth-W)/2));
  if(!r) top = Math.max(60, innerHeight/2 - 140);
  else if(r.top > innerHeight/2) top = null; else top = r.bottom + 14;
  const pos = top===null ? `bottom:${innerHeight - r.top + 14}px` : `top:${top}px`;
  box.innerHTML = ring + `<div class="tut-card" style="left:${left}px;${pos};width:${W}px">
    <div style="font-size:12px;color:var(--acc);font-weight:700;letter-spacing:.5px">${tutI+1} / ${TUT.length}</div>
    <h3 style="margin:4px 0 6px">${t(st.k+'t')}</h3>
    <p style="margin:0;color:var(--tx2);line-height:1.5;font-size:14.5px">${t(st.k+'b')}</p>
    <div class="row" style="margin-top:14px">
      ${last ? '' : `<button class="btn-g" onclick="endTutorial()">${t('tutSkip')}</button>`}
      ${tutI>0 ? `<button class="btn-g" onclick="tutGo(-1)">‹</button>` : ''}
      <button class="btn-p" onclick="${last ? 'endTutorial()' : 'tutGo(1)'}">${last ? t('tutDone') : t('tutNext')}</button></div></div>`;
}

// 30 dias de experiência; depois 6,99 €/mês (ou £). Pagamento por transferência confirmado pelo admin.
async function loadBilling(){
  try{
    const [sub, adm, cfg, cl] = await Promise.all([
      sb.from('ps_subscriptions').select('*').eq('user_id', S.user.id).maybeSingle(),
      sb.from('ps_admins').select('user_id').eq('user_id', S.user.id).maybeSingle(),
      sb.from('ps_billing_config').select('*').eq('id', 1).maybeSingle(),
      sb.from('ps_payment_claims').select('*').order('created_at', {ascending:false})
    ]);
    S.sub = sub.data || null; S.isAdmin = !!adm.data; S.billing = cfg.data || null; S.claims = cl.data || [];
    S.billingLoaded = !sub.error;
    if(S.isAdmin) await loadFeedback();
  }catch(e){ S.billingLoaded = false; }
  drawSubBar();
}
const DAY = 864e5;
function subState(){
  if(!S.billingLoaded || S.isAdmin) return {access:true, kind:'none'};
  const now = Date.now(), s = S.sub || {};
  const paid = s.paid_until ? new Date(s.paid_until).getTime() : 0;
  const trial = s.trial_ends_at ? new Date(s.trial_ends_at).getTime() : 0;
  const mine = (S.claims||[]).filter(c=>c.user_id===S.user.id);
  const pend = mine.find(c=>c.status==='pending');
  if(paid > now) return {access:true, kind:'paid', until:s.paid_until, pend};
  const rejected = mine.some(c=>c.status==='rejected');
  if(pend) return {access: !rejected && now - new Date(pend.created_at).getTime() < 7*DAY, kind:'pending', pend};
  if(trial > now) return {access:true, kind:'trial', days:Math.max(1, Math.ceil((trial-now)/DAY))};
  return {access:false, kind:'expired'};
}
const hasAccess = () => subState().access;
function drawSubBar(){
  const el = document.getElementById('sub-bar'); if(!el) return;
  const st = subState(); let h = '';
  if(st.kind==='trial') h = `<span>${t('subTrialLeft').replace('{n}', st.days)}</span><button class="btn-p" onclick="openPaywall()">${t('subSubscribe')}</button>`;
  else if(st.kind==='pending') h = `<span>${t('subPendingBar')}</span>`;
  else if(st.kind==='expired') h = `<span>${t('subExpiredBar')}</span><button class="btn-p" onclick="openPaywall()">${t('subSubscribe')}</button>`;
  el.innerHTML = h; el.className = h ? (st.kind==='expired' ? 'sub-bar late' : 'sub-bar') : 'hidden';
}
// referência única por pagamento: PS-XXXXXXXX-n (o servidor calcula a mesma)

function drawPay(){
  const el = document.getElementById('tr-box'); if(!el) return;
  const b = S.billing || {}, amt = +(psPrice(PW.cur) * PW.months).toFixed(2);
  const hasRev = !!(b.revolut_tag||'').trim();

// --- fotos: guardar no aparelho primeiro, enviar quando houver rede ---
let _idb = null;
function idb(){
  if(_idb) return _idb;
  _idb = new Promise((res, rej)=>{ const r = indexedDB.open('inv-photos', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('p');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  return _idb;
}
async function idbDo(mode, fn){ const db = await idb();
  return new Promise((res, rej)=>{ const tx = db.transaction('p', mode); const r = fn(tx.objectStore('p'));
    tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); }); }
const idbPut = (k, v) => idbDo('readwrite', s => s.put(v, k));
const idbGet = k => idbDo('readonly', s => s.get(k));
const idbDel = k => idbDo('readwrite', s => s.delete(k));
const idbKeys = () => idbDo('readonly', s => s.getAllKeys());

async function compressImage(file){
  if(!/^image\//.test(file.type) || file.type==='image/gif') return file;
  try{
    const bmp = await createImageBitmap(file);
    const max = 1800, k = Math.min(1, max/Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
    return blob || file;
  }catch(e){ return file; }
}
const URLS = {}; // path -> url (objectURL local ou signed URL)
async function photoURL(path){
  if(URLS[path]) return URLS[path];
  try{ const b = await idbGet(path); if(b){ URLS[path] = URL.createObjectURL(b); return URLS[path]; } }catch(e){}
  const {data, error} = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  if(error || !data) throw (error || new Error('no url'));
  URLS[path] = data.signedUrl; setTimeout(()=>{ if(URLS[path]===data.signedUrl) delete URLS[path]; }, 3500*1000);
  return URLS[path];
}
async function photoBlob(path){
  try{ const b = await idbGet(path); if(b) return b; }catch(e){}
  const {data, error} = await sb.storage.from(BUCKET).download(path);
  if(error) throw error; return data;
}
function fillThumbs(root){
  root.querySelectorAll('img[data-path]').forEach(async img=>{
    try{ img.src = await photoURL(img.dataset.path); }catch(e){ img.replaceWith(Object.assign(document.createElement('div'),{className:'thumb ph',textContent:'🧾'})); }
  });
}
function viewPhoto(path){
  photoURL(path).then(u=>{
    const d = document.createElement('div'); d.className = 'ph-view'; d.onclick = () => d.remove();
    d.innerHTML = `<img src="${u}" alt="">`; document.body.appendChild(d);
  }).catch(()=>toast(t('photoLoadErr')));
}
let uploading = false;
async function uploadPendingPhotos(){
  if(uploading || !S.user || !navigator.onLine) return;
  uploading = true;
  try{
    let keys = (await idbKeys()).filter(k=>String(k).startsWith(S.user.id+'/'));
    S.photoPending = keys.length; updateNetBadge();
    for(const k of keys){
      const blob = await idbGet(k); if(!blob){ await idbDel(k); continue; }
      const {error} = await sb.storage.from(BUCKET).upload(k, blob, {upsert:true, contentType: blob.type || 'image/jpeg'});
      if(error){ if(!isNetErr(error)) toast(t('photoErr')+(error.message||error)); break; }
      await idbDel(k); S.photoPending = Math.max(0, S.photoPending-1); updateNetBadge();
    }
  }catch(e){} finally { uploading = false; updateNetBadge(); }
}
