  <label>${t('expNotesLbl')}</label><textarea rows="2" oninput="X.notes=this.value">${esc(X.notes)}</textarea>
  ${inv?`<div class="card" style="margin-top:12px">${t('billedIn')} <b>${esc(inv.number)}</b>
    <button class="btn-g" style="margin-left:8px;padding:6px 10px;font-size:13px" onclick="closeSheet();editInvoice('${inv.id}')">${t('openInv')}</button>
    ${inv.status!=='paid'?`<div class="hint">${t('paidByInv')}</div>`:''}</div>`:''}
  ${!inv && X.status==='paid' && X.paid_at ? `<p class="hint" style="color:var(--green)">${t('expPaidOn')} ${dmy(X.paid_at)}</p>` : ''}
  <div class="row" style="margin-top:18px">
    <button class="btn-p" onclick="saveExpense()">${t('save')}</button>
    ${!X._new && !inv && X.billable ? (X.status==='paid'
      ? `<button class="btn-g" onclick="setExpPaid(false)">${t('markExpUnpaid')}</button>`
      : `<button class="btn-green" onclick="setExpPaid(true)">${t('markExpPaid')}</button>`) : ''}</div>
  <div class="row" style="margin-top:10px"><button class="btn-g" onclick="cancelExpense()">${t('closeBtn')}</button></div>
  ${!X._new?`<div class="row" style="margin-top:10px"><button class="btn-red" onclick="delExpense()">${t('delExp')}</button></div>`:''}`);
  drawPhotos();
}
function drawPhotos(){
  const el = document.getElementById('ph-grid'); if(!el) return;
  el.innerHTML = (X.photos||[]).length ? X.photos.map((p,i)=> /\.pdf$/i.test(p.path)
      ? `<div class="ph-it"><div class="thumb ph" style="width:84px;height:84px" onclick="openPdfProof('${esc(p.path)}')">PDF</div><button class="del-x" onclick="rmPhoto(${i})">✕</button></div>`
      : `<div class="ph-it"><img data-path="${esc(p.path)}" onclick="viewPhoto('${esc(p.path)}')" alt=""><button class="del-x" onclick="rmPhoto(${i})">✕</button></div>`).join('')
    : `<p class="hint" style="margin:0">${t('noPhotos')}</p>`;
  fillThumbs(el);
  const pb = document.getElementById('ph-pdf');
  if(pb) pb.innerHTML = (X.photos||[]).length
    ? `<button class="btn-g" style="width:100%;margin-top:10px" onclick="downloadExpensePdf()">${t('expPdf')}</button>` : '';
}
async function openPdfProof(path){
  try{ const b = await photoBlob(path); window.open(URL.createObjectURL(b), '_blank'); }catch(e){ toast(t('photoLoadErr')); }
}
async function addPhotos(input){
  const files = Array.from(input.files||[]); input.value = '';
  for(const f of files){
    const isPdf = f.type==='application/pdf';
    const blob = isPdf ? f : await compressImage(f);
    const path = `${S.user.id}/${X.id}/${newId()}.${isPdf?'pdf':'jpg'}`;
    await idbPut(path, blob);
    X.photos.push({path, at:new Date().toISOString()}); X._added.push(path);
  }
  drawPhotos();
}
function rmPhoto(i){ const [p] = X.photos.splice(i,1); if(p) X._removed.push(p.path); drawPhotos(); }
async function cancelExpense(){
  // fotos tiradas mas não guardadas: apagar do aparelho
  for(const p of (X._added||[])) { try{ await idbDel(p); }catch(e){} }
  closeSheet();
}
async function saveExpense(){
  if(!(X.description||'').trim()){ toast(t('needExpDesc')); return; }
  if(X.amount==='' || isNaN(Number(X.amount))){ toast(t('needExpAmount')); return; }
  const rec = {id:X.id, user_id:S.user.id, client_id:X.client_id||null, exp_date:X.exp_date||todayISO(),
    description:X.description.trim(), category:X.category||null, amount:Number(X.amount)||0,
    currency:normCur(X.currency), billable:!!X.billable,
    invoice_id: X.billable ? (X.invoice_id||null) : null,
    photos:(X.photos||[]).map(p=>({path:p.path, at:p.at})), notes:X.notes||''};
  rec.status = rec.invoice_id ? 'billed' : (X.status==='paid' && rec.billable ? 'paid' : 'pending');
  rec.paid_at = rec.status==='paid' ? (X.paid_at || todayISO()) : null;
  const old = S.expenses.find(x=>x.id===rec.id); if(old && old.created_at) rec.created_at = old.created_at;
  let mode;
  try{ mode = await dbWrite('inv_expenses','upsert',rec); }
  catch(e){ toast('Erro: '+(e.message||e)); await loadAll(); render(); return; }
  const removed = X._removed.filter(p=>!X._added.includes(p));
  for(const p of X._removed){ try{ await idbDel(p); }catch(e){} }
  if(removed.length && navigator.onLine) sb.storage.from(BUCKET).remove(removed).catch(()=>{});
  closeSheet(); render(); if(mode==='online') toast(X._paidMsg || t('savedExp'));
  uploadPendingPhotos();
}
function setExpPaid(p){
  X.status = p ? 'paid' : 'pending'; X.paid_at = p ? todayISO() : null;
  X._paidMsg = p ? t('savedExpPaid') : t('savedExpUnpaid');
  saveExpense();
}
async function delExpense(){
  if(!confirm(t('confirmDelExp'))) return;
  const paths = (X.photos||[]).map(p=>p.path).concat(X._removed||[]);
  let mode;
  try{ mode = await dbWrite('inv_expenses','delete',null,X.id); }
  catch(e){ toast('Erro: '+(e.message||e)); await loadAll(); render(); return; }
  for(const p of paths){ try{ await idbDel(p); }catch(e){} }
  if(paths.length && navigator.onLine) sb.storage.from(BUCKET).remove(paths).catch(()=>{});
  closeSheet(); render(); if(mode==='online') toast(t('deletedExp'));
}

// --- ligação despesas <-> faturas ---
function invoiceExpenses(inv){
  const ids = new Set((inv.lines||[]).map(l=>l.exp_id).filter(Boolean));
  return S.expenses.filter(x=>ids.has(x.id) || (inv.id && x.invoice_id===inv.id));
}
function expLine(x){
  return {desc:`${x.description}${x.category?' ('+catName(x.category)+')':''} · ${dmy(x.exp_date)}`,
          qty:1, price:Number(x.amount)||0, currency:normCur(x.currency), exp_id:x.id};
}
function pendingFor(clientId){
  const used = new Set((E && E.lines||[]).map(l=>l.exp_id).filter(Boolean));
  return S.expenses.filter(x=>isPending(x) && x.client_id===clientId && !used.has(x.id))
    .sort((a,b)=>(a.exp_date||'').localeCompare(b.exp_date||''));
}
function drawExpBox(){
  const el = document.getElementById('exp-box'); if(!el || !E) return;
  const pend = expInvOn() ? pendingFor(E.client_id) : [];
  const linked = invoiceExpenses(E).filter(x=>(E.lines||[]).some(l=>l.exp_id===x.id));
  const withPh = linked.filter(x=>(x.photos||[]).length);
  el.innerHTML = (pend.length ? `<button class="btn-g" style="margin-top:8px;border-color:var(--amber);color:var(--amber)" onclick="addPendingExpenses()">${t('addExpBtn').replace('{n}',pend.length)}</button>` : '')
    + (linked.length ? `<p class="hint" style="margin:8px 0 0">📎 ${t('expLinked').replace('{n}',linked.length)}</p>` : '')
    + (withPh.length && E.id ? `<button class="btn-g" style="margin-top:8px" onclick="downloadReceipts()">${t('receiptsPdf')}</button>` : '');
}
function addPendingExpenses(){
  const pend = pendingFor(E.client_id);
  E.lines = (E.lines||[]).filter(l=>l.desc||l.price);
  pend.forEach(x=>E.lines.push(expLine(x)));
  drawLines(); prefetchPhotos(pend);
}
function billExpenses(clientId){
  editInvoice(null);
  if(!E) return;
  E.client_id = clientId;
  openSheet(invoiceForm());
  addPendingExpenses();
}
async function linkExpenses(inv){
  const ids = new Set((inv.lines||[]).map(l=>l.exp_id).filter(Boolean));
  for(const x of S.expenses.slice()){
    const want = ids.has(x.id);
    if(want && x.invoice_id!==inv.id) await dbWrite('inv_expenses','upsert',{...x, invoice_id:inv.id, status:'billed', billable:true});
    else if(!want && x.invoice_id===inv.id) await dbWrite('inv_expenses','upsert',{...x, invoice_id:null, status:'pending'});
  }
}

// --- PDF de recibos (prova para o cliente) ---
const DATAURLS = {};
const blobToDataURL = b => new Promise((res, rej)=>{ const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const imgSize = src => new Promise((res, rej)=>{ const i = new Image(); i.onload = () => res({w:i.naturalWidth, h:i.naturalHeight}); i.onerror = rej; i.src = src; });
async function photoDataURL(path){
  if(DATAURLS[path]) return DATAURLS[path];
  const b = await photoBlob(path);
  const src = await blobToDataURL(b); const sz = await imgSize(src);
  return (DATAURLS[path] = {src, ...sz});
}
function prefetchPhotos(exps){
  (exps||[]).forEach(x=>(x.photos||[]).forEach(p=>{ if(!/\.pdf$/i.test(p.path)) photoDataURL(p.path).catch(()=>{}); }));
}
const receiptsName = inv => `Receipts_${(inv.number||'').replace(/[^\w-]/g,'_')}.pdf`;
async function buildReceiptsPDF(exps, inv){
  await ensurePdfFonts().catch(()=>{});
  // sem fatura: usa o cliente se as despesas forem todas do mesmo, senão o idioma da app
  const cids = [...new Set(exps.map(x=>x.client_id))];
  const c = (inv ? clientOf(inv) : cids.length===1 && S.clients.find(k=>k.id===cids[0])) || {};
  const lang = inv ? c.language : (c.language || L);
  const P = RECEIPTS_L[lang] || RECEIPTS_L.en;
  const loc = (PDFL[lang] || PDFL.en).locale;
  const money = (v,cur) => pdfMoney(loc, v, cur);
  const doc = newPdf(JSON.stringify([exps.map(x=>[x.description, x.currency]), c, S.settings, P, inv && inv.number]) +
    [...new Set(exps.map(x=>normCur(x.currency)))].map(k=>money(1234.5,k)).join(''));
  const W = 210, H = 297, M = 16;
  doc.setFillColor(47,92,190); doc.rect(0,0,W,4,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(20); doc.setTextColor(30,33,40);
  doc.text(P.title, M, 20);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(115,120,130);
  doc.text([inv && inv.number ? `${P.inv} ${inv.number}` : '', c.company||'', S.settings.business_name||''].filter(Boolean).join('  ·  '), M, 27);
  let y = 38;
  doc.setFillColor(30,33,40); doc.rect(M, y, W-2*M, 8, 'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(255,255,255);
  doc.text('#', M+3, y+5.3); doc.text(P.date, M+12, y+5.3); doc.text(P.desc, M+38, y+5.3); doc.text(P.amt, W-M-3, y+5.3, {align:'right'});
  y += 8;
  const tot = {};
  exps.forEach((x,i)=>{
    const cur = normCur(x.currency); tot[cur] = (tot[cur]||0) + (Number(x.amount)||0);
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(30,33,40);
    const dl = doc.splitTextToSize(x.description||'', 110);
    const rh = Math.max(7, dl.length*4.6+3);
    if(y+rh > H-20){ doc.addPage(); y = 20; }
    doc.text(String(i+1), M+3, y+5); doc.text(dmy(x.exp_date), M+12, y+5);
    dl.forEach((l,k)=>doc.text(l, M+38, y+5+k*4.6));
    doc.setFont('helvetica','bold'); doc.text(money(x.amount,cur), W-M-3, y+5, {align:'right'});
    y += rh; doc.setDrawColor(226,228,234); doc.line(M, y, W-M, y);
  });
  y += 7; doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text(`${P.total}: ${CURRENCIES.filter(k=>tot[k]).map(k=>money(tot[k],k)).join(' + ') || money(0,'EUR')}`, W-M-3, y, {align:'right'});
  for(let i=0;i<exps.length;i++){
    const x = exps[i];
    for(const p of (x.photos||[])){
      doc.addPage();
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(30,33,40);
      doc.text(`#${i+1}  ${dmy(x.exp_date)}  ·  ${money(x.amount, normCur(x.currency))}`, M, 14);
      doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(115,120,130);
      doc.text(doc.splitTextToSize(x.description||'', W-2*M)[0]||'', M, 20);
      if(/\.pdf$/i.test(p.path)){ doc.text(P.pdfNote, M, 30); continue; }
      try{
        const im = await photoDataURL(p.path);
        const bw = W-2*M, bh = H-26-14;
        const k = Math.min(bw/im.w, bh/im.h);
        const w = im.w*k, h = im.h*k;
        doc.addImage(im.src, /^data:image\/png/.test(im.src) ? 'PNG' : 'JPEG', M+(bw-w)/2, 26, w, h);
      }catch(e){ doc.text('[foto indisponível / photo unavailable]', M, 30); }
    }
  }
  const n = doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(115,120,130);
    doc.text(`${P.page} ${i}/${n}`, W-M, H-8, {align:'right'}); }
  return doc;
}
function downloadBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function downloadReceipts(){
  const exps = invoiceExpenses(E).filter(x=>(x.photos||[]).length);
  try{ (await buildReceiptsPDF(exps, E)).save(receiptsName(E)); toast(t('pdfDone')); }
  catch(e){ toast(t('photoLoadErr')); }
}
// --- PDF de fotos escolhidas na aba Despesas (uma ou várias, tudo num só PDF) ---
const fileSafe = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40);
async function savePhotosPdf(exps, name){
  exps = exps.slice().sort((a,b)=>(a.exp_date||'').localeCompare(b.exp_date||''));
  toast(t('pdfBuilding'));
  try{ (await buildReceiptsPDF(exps, null)).save(name); toast(t('pdfDone')); }
  catch(e){ toast(t('photoLoadErr')); }
}
function downloadSelected(){
  const ids = new Set((S.eSelList||[]).filter(id=>S.eSel && S.eSel.has(id)));
  const exps = S.expenses.filter(x=>ids.has(x.id) && (x.photos||[]).length);
  if(!exps.length){ toast(t('selEmpty')); return; }
  const name = exps.length===1
    ? `${(EMAIL_L[L]||EMAIL_L.en).receiptFile}_${fileSafe(exps[0].description)}_${exps[0].exp_date||todayISO()}.pdf`
    : `${(EMAIL_L[L]||EMAIL_L.en).receiptsFile}_${todayISO()}_${exps.length}.pdf`;
  savePhotosPdf(exps, name);
}
function downloadExpensePdf(){
  if(!X || !(X.photos||[]).length) return;
  savePhotosPdf([{...X, amount:Number(X.amount)||0}],
    `${(EMAIL_L[L]||EMAIL_L.en).receiptFile}_${fileSafe(X.description)}_${X.exp_date||todayISO()}.pdf`);
}
applyLang();
initCaptcha(); initLegal(); prefillLogin(); drawLanding();
</script>
